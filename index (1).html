<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Food Management System</title>

<style>

body{
    margin:0;
    height:100vh;
    color:blue;
    font-family:Arial,sans-serif;
}

.full-body{
    display:grid;

    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);

    width:100%;
    height:100vh;
}

#header-left{

    background:#ff9999;

    grid-column:1 / 7;
    grid-row:1 / 2;

    display:flex;
    align-items:center;

    gap:15px;
    padding:10px;

}

#header-right{

    background:#99ccff;

    grid-column:7 / 11;
    grid-row:1 / 2;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:bold;

}

.title{
    flex:1;
}

.title h2{
    margin:0;
    font-size:20px;
}

.title p{
    margin:5px 0 0;
    font-size:14px;
}

#Feature{

    background:#e8f5e9;

    grid-column:1 / 3;
    grid-row:2 / 10;

    overflow-y:auto;

    padding:8px;

}

#Feature table{

    width:100%;

    border-collapse:collapse;

    border:2px solid #333;

}

#Feature td{

    padding:4px;

    border:1px solid #999;

}

#Feature button{

    width:100%;

    min-height:40px;

    border:none;

    border-radius:5px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

#Feature button:hover{

    transform:scale(1.02);

}

#display{

    background:#ffff99;

    grid-column:3 / 11;
    grid-row:2 / 10;

    overflow-y:auto;

    padding:20px;

}

#footer{

    background:#cccccc;

    grid-column:1 / 11;
    grid-row:10 / 11;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

}

#display table{

    border-collapse:collapse;

    width:100%;

}

#display th,
#display td{

    border:2px solid #333;

    padding:10px;

    text-align:center;

}

#display th{

    background:#99ccff;

}

.form{

    padding:10px;

}

</style>

</head>


<body>


<div class="full-body">


    <!-- HEADER LEFT -->

    <div id="header-left">

        <div class="title">

            <h2>
                Restaurant Food Management System
            </h2>

            <p>
                Food Ordering and Management
            </p>

        </div>

    </div>


    <!-- HEADER RIGHT -->

    <div id="header-right">

        Restaurant

    </div>


    <!-- FEATURE -->

    <div id="Feature">

        <table
            border="2"
            cellspacing="0"
            cellpadding="5"
            width="100%"
        >


            <!-- DISPLAY FOOD MENU -->

            <tr>

                <td>

                    <button
                        onclick="food_menu()"
                        style="background-color:#ff9999;"
                    >

                        Display Food Menu

                    </button>

                </td>

            </tr>


            <!-- ORDER FOOD -->

            <tr>

                <td>

                    <button
                        onclick="food_information()"
                        style="background-color:#ff03c0;"
                    >

                        Order Food

                    </button>

                </td>

            </tr>


            <!-- CHANGE FOOD ITEM -->

            <tr>

                <td>

                    <button
                        onclick="chang_food_item()"
                        style="background:#99ccff;"
                    >

                        Change Food Item

                    </button>

                </td>

            </tr>


            <!-- DELETE FOOD ITEM -->

            <tr>

                <td>

                    <button
                        onclick="delete_food_item()"
                        style="background:#99ff99;"
                    >

                        Delete Food Item

                    </button>

                </td>

            </tr>


            <!-- PRINT ORDER -->

            <tr>

                <td>

                    <button
                        onclick="print_order()"
                        style="background:#ffcc66;"
                    >

                        Print All Food List

                    </button>

                </td>

            </tr>


            <!-- RESET ORDER -->

            <tr>

                <td>

                    <button
                        onclick="clear_orders()"
                        style="background:#cc99ff;"
                    >

                        Reset Order

                    </button>

                </td>

            </tr>


            <!-- ADMIN LOGIN -->

            <tr>

                <td>

                    <button
                        onclick="password()"
                        style="background:#ff6666;"
                    >

                        Admin Login

                    </button>

                </td>

            </tr>


        </table>

    </div>


    <!-- DISPLAY -->

    <div id="display">

        <h2>
            Welcome to Restaurant Food Management System
        </h2>

    </div>


    <!-- FOOTER -->

    <div id="footer">

        Restaurant Food Management System

    </div>


</div>


<script>

let menu = [];
let n = 0;
let total_amount_money = 0;
let total = 0;

function food_menu(){

    fetch("menu.json")

    .then(function(response){

        if(!response.ok){
            throw new Error("menu.json file not found");
        }

        return response.json();

    })

    .then(function(data){

        let food = data.food;

        let output = "";

        output += `

            <div class="form">

                <h1>Food Menu</h1>

                <br>

                <table
                    border="2"
                    cellspacing="0"
                    cellpadding="10"
                    width="100%"
                >

                    <tr>
                        <th>NO</th>
                        <th>Food Name</th>
                        <th>Food Price</th>
                    </tr>

        `;

        for(let i = 0; i < food.length; i++){

            output += `

                    <tr>

                        <td>${food[i].id}</td>

                        <td>${food[i].food_name}</td>

                        <td>${food[i].food_price} Taka</td>

                    </tr>

            `;

        }

        output += `

                </table>

            </div>

        `;

        document.getElementById("display").innerHTML =
            output;

    })

    .catch(function(error){

        document.getElementById("display").innerHTML = `

            <div class="form">

                <h2>Menu Loading Error!</h2>

                <p>${error.message}</p>

            </div>

        `;

    });

}


function food_information(){

    fetch("menu.json")

    .then(function(response){

        if(!response.ok){
            throw new Error("menu.json file not found");
        }

        return response.json();

    })

    .then(function(data){

        let food = data.food;

        let text = "Food Menu\n\n";

        for(let i = 0; i < food.length; i++){

            text +=
                food[i].id +
                ". " +
                food[i].food_name +
                " - " +
                food[i].food_price +
                " Taka\n";

        }

        let food_number =
            Number(
                prompt(
                    text +
                    "\nEnter Food Number:"
                )
            );

        if(!Number.isInteger(food_number)){

            alert("Invalid food number!");
            return;

        }

        let selected_food =
            food.find(function(item){

                return Number(item.id) === food_number;

            });

        if(!selected_food){

            alert("Food not found!");
            return;

        }

        let quantity =
            Number(
                prompt(
                    "Enter amount of food quantities:"
                )
            );

        if(
            !Number.isInteger(quantity) ||
            quantity <= 0
        ){

            alert("Invalid quantity!");
            return;

        }

        let price =
            quantity *
            Number(selected_food.food_price);

        n++;

        menu.push({

            no: n,

            food_id: selected_food.id,

            food_name: selected_food.food_name,

            amount_of_food_quantities: quantity,

            price: price

        });

        total_amount_money += price;

        total += price;

        alert(
            selected_food.food_name +
            " added successfully!"
        );

        print_order();

    })

    .catch(function(error){

        alert(error.message);

    });

}


function chang_food_item(){

    if(menu.length === 0){

        alert("No order available!");
        return;

    }

    let text = "Current Orders\n\n";

    for(let i = 0; i < menu.length; i++){

        text +=
            menu[i].no +
            ". " +
            menu[i].food_name +
            " | Quantity: " +
            menu[i].amount_of_food_quantities +
            " | Price: " +
            menu[i].price +
            " Taka\n";

    }

    let order_number =
        Number(
            prompt(
                text +
                "\nEnter Order Number:"
            )
        );

    if(
        !Number.isInteger(order_number) ||
        order_number < 1 ||
        order_number > menu.length
    ){

        alert("Invalid order number!");
        return;

    }

    let choice =
        Number(
            prompt(
                "1. Change Quantity\n" +
                "2. Change Food Item\n\n" +
                "Enter Choice:"
            )
        );

    let index = order_number - 1;

    if(choice === 1){

        let quantity =
            Number(
                prompt(
                    "Enter new quantity:"
                )
            );

        if(
            !Number.isInteger(quantity) ||
            quantity <= 0
        ){

            alert("Invalid quantity!");
            return;

        }

        getFoodData(menu[index].food_id)

        .then(function(foodData){

            if(!foodData){

                alert("Food not found!");
                return;

            }

            let oldPrice =
                Number(menu[index].price);

            let newPrice =
                quantity *
                Number(foodData.food_price);

            menu[index].amount_of_food_quantities =
                quantity;

            menu[index].price =
                newPrice;

            total_amount_money =
                total_amount_money -
                oldPrice +
                newPrice;

            total =
                total -
                oldPrice +
                newPrice;

            alert("Quantity changed successfully!");

            print_order();

        })

        .catch(function(error){

            alert(error.message);

        });

    }

    else if(choice === 2){

        fetch("menu.json")

        .then(function(response){

            if(!response.ok){
                throw new Error("menu.json file not found");
            }

            return response.json();

        })

        .then(function(data){

            let food = data.food;

            let text = "Food Menu\n\n";

            for(let i = 0; i < food.length; i++){

                text +=
                    food[i].id +
                    ". " +
                    food[i].food_name +
                    " - " +
                    food[i].food_price +
                    " Taka\n";

            }

            let food_number =
                Number(
                    prompt(
                        text +
                        "\nEnter New Food Number:"
                    )
                );

            if(!Number.isInteger(food_number)){

                alert("Invalid food number!");
                return;

            }

            let selected_food =
                food.find(function(item){

                    return Number(item.id) ===
                           food_number;

                });

            if(!selected_food){

                alert("Food not found!");
                return;

            }

            let quantity =
                Number(
                    prompt(
                        "Enter quantity:"
                    )
                );

            if(
                !Number.isInteger(quantity) ||
                quantity <= 0
            ){

                alert("Invalid quantity!");
                return;

            }

            let oldPrice =
                Number(menu[index].price);

            let newPrice =
                quantity *
                Number(selected_food.food_price);

            menu[index].food_id =
                selected_food.id;

            menu[index].food_name =
                selected_food.food_name;

            menu[index].amount_of_food_quantities =
                quantity;

            menu[index].price =
                newPrice;

            total_amount_money =
                total_amount_money -
                oldPrice +
                newPrice;

            total =
                total -
                oldPrice +
                newPrice;

            alert("Food item changed successfully!");

            print_order();

        })

        .catch(function(error){

            alert(error.message);

        });

    }

    else{

        alert("Invalid choice!");

    }

}


function getFoodData(food_id){

    return fetch("menu.json")

    .then(function(response){

        if(!response.ok){
            throw new Error("menu.json file not found");
        }

        return response.json();

    })

    .then(function(data){

        return data.food.find(
            function(item){

                return String(item.id) ===
                       String(food_id);

            }
        );

    });

}


function delete_food_item(){

    if(menu.length === 0){

        alert("No order available!");
        return;

    }

    let text = "Current Orders\n\n";

    for(let i = 0; i < menu.length; i++){

        text +=
            menu[i].no +
            ". " +
            menu[i].food_name +
            " | Quantity: " +
            menu[i].amount_of_food_quantities +
            " | Price: " +
            menu[i].price +
            " Taka\n";

    }

    let delete_number =
        Number(
            prompt(
                text +
                "\nEnter Order Number to Delete:"
            )
        );

    if(
        !Number.isInteger(delete_number) ||
        delete_number < 1 ||
        delete_number > menu.length
    ){

        alert("Invalid order number!");
        return;

    }

    let index = delete_number - 1;

    total_amount_money -=
        Number(menu[index].price);

    total -=
        Number(menu[index].price);

    menu.splice(index,1);

    for(let i = 0; i < menu.length; i++){

        menu[i].no = i + 1;

    }

    n = menu.length;

    alert("Food item deleted successfully!");

    print_order();

}


function print_order(){

    let output = "";

    if(menu.length === 0){

        output = `

            <div class="form">

                <h2>
                    No food ordered yet.
                </h2>

            </div>

        `;

        document.getElementById("display").innerHTML =
            output;

        return;

    }

    output += `

        <div class="form">

            <h1>Order List</h1>

            <br>

            <table
                border="2"
                cellspacing="0"
                cellpadding="10"
                width="100%"
            >

                <tr>

                    <th>NO</th>

                    <th>Food Name</th>

                    <th>Quantity</th>

                    <th>Food Price</th>

                </tr>

    `;

    for(let i = 0; i < menu.length; i++){

        output += `

                <tr>

                    <td>
                        ${menu[i].no}
                    </td>

                    <td>
                        ${menu[i].food_name}
                    </td>

                    <td>
                        ${menu[i].amount_of_food_quantities}
                    </td>

                    <td>
                        ${menu[i].price} Taka
                    </td>

                </tr>

        `;

    }

    output += `

            </table>

            <br>

            <h2>
                Total Amount Money =
                ${total_amount_money}
                Taka
            </h2>

        </div>

    `;

    document.getElementById("display").innerHTML =
        output;

}


function clear_orders(){

    menu = [];

    n = 0;

    total_amount_money = 0;

    total = 0;

    document.getElementById("display").innerHTML = `

        <div class="form">

            <h1>
                Order Reset
            </h1>

            <br>

            <h2>
                All orders have been cleared.
            </h2>

        </div>

    `;

}


function password(){

    let password =
        prompt(
            "Enter the Admin password:"
        );

    if(
        password === "242002140" ||
        password === "242002113"
    ){

        document.getElementById("display").innerHTML = `

            <div class="form">

                <h1>
                    Admin Login Successful
                </h1>

                <br>

                <h2>
                    Total Amount Money =
                    ${total}
                    Taka
                </h2>

            </div>

        `;

    }

    else{

        document.getElementById("display").innerHTML = `

            <div class="form">

                <h1>
                    Admin Login Failed
                </h1>

                <br>

                <h2>
                    You are not an owner
                    of this restaurant.
                </h2>

            </div>

        `;

    }

}
</script>

</body>

</html>
